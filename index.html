<style>
:root{
 --azul:#003b80;
 --azul2:#006ee6;
 --verde:#25d366;
 --fundo:#eef3f8;
 --texto:#1f2937;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--fundo);
 color:var(--texto);
}
header{
 background:linear-gradient(135deg,#002b5f,#005bbb);
 color:white;
 text-align:center;
 padding:22px 12px;
}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0}

.banner{
 background:linear-gradient(135deg,#005bbb,#003b80);
 color:white;
 text-align:center;
 padding:35px 15px;
}
.banner img{
 max-width:220px;
 border-radius:24px;
 background:white;
 padding:10px;
 box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.banner h2{font-size:28px;margin:18px 0 8px}
.banner p{font-size:17px}

.box{
 background:white;
 margin:18px auto;
 padding:20px;
 border-radius:18px;
 box-shadow:0 4px 14px rgba(0,0,0,.12);
 max-width:1150px;
}
.categorias{
 display:flex;
 gap:10px;
 overflow:auto;
 padding:14px;
 background:white;
 position:sticky;
 top:0;
 z-index:5;
 box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.categorias button{
 background:var(--azul);
 color:white;
 border:0;
 padding:12px 18px;
 border-radius:50px;
 font-weight:bold;
 white-space:nowrap;
}
.produtos{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:24px;
 padding:24px;
 max-width:1250px;
 margin:auto;
}
.card{
 background:white;
 border-radius:22px;
 padding:16px;
 box-shadow:0 6px 20px rgba(0,0,0,.18);
 text-align:center;
 transition:.2s;
}
.card:hover{transform:translateY(-4px)}
.card img{
 width:100%;
 height:250px;
 object-fit:contain;
 border-radius:16px;
 background:white;
 border:1px solid #eef2f7;
}
.card h3{
 font-size:18px;
 min-height:48px;
 margin:14px 0 6px;
}
.preco{
 font-size:28px;
 color:#078227;
 font-weight:bold;
 margin:10px 0;
}
.reservado{
 background:#ffcc00;
 color:#111;
 padding:7px 12px;
 border-radius:50px;
 font-weight:bold;
 display:inline-block;
 margin-bottom:8px;
}
.esgotado{
 color:#c00;
 font-weight:bold;
}
button{
 background:var(--verde);
 color:white;
 border:0;
 padding:13px 18px;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
 margin:4px;
}
button:hover{filter:brightness(.95)}
.danger{background:#c00}
input,textarea,select{
 width:100%;
 padding:13px;
 margin:8px 0;
 border:1px solid #cbd5e1;
 border-radius:12px;
 font-size:15px;
}
.item{
 border-bottom:1px solid #ddd;
 padding:12px 0;
}
.whats-fixo{
 position:fixed;
 bottom:18px;
 right:18px;
 background:#25d366;
 color:white;
 padding:16px 20px;
 border-radius:50px;
 font-weight:bold;
 text-decoration:none;
 box-shadow:0 4px 15px rgba(0,0,0,.35);
 z-index:20;
}
footer{
 background:#003b80;
 color:white;
 text-align:center;
 padding:22px;
 margin-top:25px;
}
@media(max-width:900px){
 header h1{font-size:23px}
 .banner h2{font-size:23px}
 .produtos{
  grid-template-columns:1fr;
  padding:12px;
 }
 .card img{height:280px}
 .box{margin:12px}
}
</style>
