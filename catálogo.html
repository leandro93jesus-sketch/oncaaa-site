<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo - Onça Produtos de Limpeza</title>

<style>
:root{
 --azul:#003b80;
 --azul2:#006ee6;
 --verde:#25d366;
 --fundo:#eef3f8;
 --texto:#1f2937;
 --amarelo:#ffcc00;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--fundo);
 color:var(--texto);
}
.topo{
 background:linear-gradient(135deg,#001f4d,#005bbb);
 color:white;
 text-align:center;
 padding:30px 15px;
}
.topo img{
 max-width:170px;
 background:white;
 padding:10px;
 border-radius:24px;
 box-shadow:0 8px 22px rgba(0,0,0,.3);
}
.topo h1{
 margin:15px 0 5px;
 font-size:32px;
}
.topo p{
 margin:5px 0;
 font-size:17px;
}
.acoes{
 background:white;
 padding:15px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:10;
 box-shadow:0 3px 12px rgba(0,0,0,.18);
}
.acoes button{
 border:0;
 padding:14px 22px;
 border-radius:14px;
 margin:5px;
 font-weight:bold;
 cursor:pointer;
 color:white;
 font-size:16px;
}
.btn-pdf{background:#003b80}
.btn-whats{background:#25d366}
.info{
 max-width:1100px;
 margin:18px auto;
 background:white;
 padding:20px;
 border-radius:18px;
 box-shadow:0 5px 15px rgba(0,0,0,.12);
 text-align:center;
}
.info h2{
 margin:0 0 8px;
 color:#003b80;
}
.catalogo{
 max-width:1200px;
 margin:auto;
 padding:20px;
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:22px;
}
.produto{
 background:white;
 border-radius:20px;
 padding:15px;
 text-align:center;
 box-shadow:0 6px 18px rgba(0,0,0,.15);
 border:1px solid #e5e7eb;
 page-break-inside:avoid;
}
.produto img{
 width:100%;
 height:220px;
 object-fit:contain;
 background:white;
 border-radius:16px;
}
.produto h3{
 font-size:18px;
 min-height:48px;
 margin:12px 0 8px;
}
.preco{
 font-size:28px;
 color:#078227;
 font-weight:bold;
 margin:8px 0;
}
.preco-antigo{
 color:#777;
 text-decoration:line-through;
 margin:4px 0;
}
.estoque{
 font-size:14px;
 color:#555;
}
.selo{
 display:inline-block;
 padding:7px 13px;
 border-radius:50px;
 font-weight:bold;
 font-size:13px;
 margin-bottom:8px;
}
.reservado{
 background:#ffcc00;
 color:#111;
}
.promocao{
 background:#e11d48;
 color:white;
}
.rodape{
 background:#003b80;
 color:white;
 text-align:center;
 padding:25px;
 margin-top:25px;
}
.carregando{
 text-align:center;
 padding:35px;
 font-size:20px;
 color:#003b80;
}
.categoria{
 font-size:13px;
 background:#eef3f8;
 display:inline-block;
 padding:6px 10px;
 border-radius:30px;
 margin-top:6px;
}

@media(max-width:700px){
 .catalogo{
   grid-template-columns:1fr;
   padding:12px;
 }
 .produto img{
   height:260px;
 }
 .topo h1{
   font-size:25px;
 }
}

@media print{
 body{
   background:white;
 }
 .acoes{
   display:none;
 }
 .topo{
   padding:20px 10px;
 }
 .topo img{
   max-width:110px;
 }
 .topo h1{
   font-size:24px;
 }
 .topo p{
   font-size:13px;
 }
 .info{
   box-shadow:none;
   border:1px solid #ddd;
   margin:10px 0;
   border-radius:10px;
 }
 .catalogo{
   display:grid;
   grid-template-columns:repeat(2,1fr);
   gap:12px;
   padding:5px;
   max-width:100%;
 }
 .produto{
   box-shadow:none;
   border:1px solid #ddd;
   border-radius:12px;
   padding:10px;
 }
 .produto img{
   height:150px;
 }
 .produto h3{
   font-size:14px;
   min-height:auto;
 }
 .preco{
   font-size:20px;
 }
 .rodape{
   margin-top:10px;
   padding:15px;
   font-size:12px;
 }
}
</style>

</head>
