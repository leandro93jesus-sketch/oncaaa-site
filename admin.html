<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Onça 4.3</title>

<style>
body{font-family:Arial;background:#f2f4f8;margin:0;padding:20px}
.container{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:#28a745;color:white;border:none;font-weight:bold;cursor:pointer}
img{max-width:150px;display:block;margin:auto}
.produto{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:10px}
.excluir{background:#c00}
.ocultar{background:#ff9800}
.mostrar{background:#007bff}
</style>
</head>
<body>

<div class="container">

<h2>Painel Admin Onça 4.3</h2>

<input type="text" id="nome" placeholder="Nome do produto">
<input type="number" id="preco" placeholder="Preço">
<input type="number" id="precoAntigo" placeholder="Preço antigo">
<input type="number" id="estoque" placeholder="Estoque">

<select id="categoria">
<option value="limpeza">Limpeza</option>
<option value="automotivo">Automotivo</option>
<option value="utensilios">Utensílios</option>
<option value="promocoes">Promoções</option>
</select>

<select id="status">
<option value="">Normal</option>
<option value="reservado">Reservado</option>
</select>

<input type="file" id="foto" accept="image/*">

<button onclick="uploadFoto()">Enviar Foto</button>

<img id="preview">

<input type="text" id="imgUrl" placeholder="URL da imagem">

<button onclick="salvarProduto()">Salvar Produto</button>

<hr>

<input type="text" id="buscar" placeholder="Buscar produto" oninput="listarProdutos()">

<div id="listaProdutos"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
doc,
updateDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAkq8rimqGQ6BYd6sfAkTiHsl7g5nnP5fc",
authDomain:"oncas-produtos-de-limpeza.firebaseapp.com",
projectId:"oncas-produtos-de-limpeza"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];

window.uploadFoto = async function(){

const file = document.getElementById("foto").files[0];

if(!file){
alert("Escolha uma foto");
return;
}

const formData = new FormData();
formData.append("file", file);
formData.append("upload_preset", "ONCA_UPLOAD");

const response = await fetch(
"https://api.cloudinary.com/v1_1/difiv4ogr/image/upload",
{
method:"POST",
body:formData
});

const data = await response.json();

if(data.secure_url){
document.getElementById("imgUrl").value = data.secure_url;
document.getElementById("preview").src = data.secure_url;
alert("Foto enviada!");
}else{
alert("Erro no upload");
}

}

window.salvarProduto = async function(){

await addDoc(collection(db,"produtos"),{
nome:document.getElementById("nome").value,
preco:Number(document.getElementById("preco").value),
precoAntigo:Number(document.getElementById("precoAntigo").value || 0),
estoque:Number(document.getElementById("estoque").value),
categoria:document.getElementById("categoria").value,
status:document.getElementById("status").value,
img:document.getElementById("imgUrl").value,
ativo:Number(document.getElementById("estoque").value) > 0
});

alert("Produto salvo!");

}

onSnapshot(collection(db,"produtos"), snap=>{
produtos = snap.docs.map(doc=>({
id:doc.id,
...doc.data()
}));

listarProdutos();
});

window.listarProdutos = function(){

const busca = (document.getElementById("buscar").value || "").toLowerCase();

const filtrados = produtos.filter(p =>
(p.nome || "").toLowerCase().includes(busca)
);

document.getElementById("listaProdutos").innerHTML = filtrados.map(p=>`
<div class="produto">
<img src="${p.img}">
<b>${p.nome}</b><br>
Preço: R$ ${p.preco}<br>
Preço antigo: R$ ${p.precoAntigo || 0}<br>
Estoque: ${p.estoque}<br>
Categoria: ${p.categoria}<br>
Status: ${p.status || "normal"}<br>
Ativo: ${p.ativo ? "Sim" : "Não"}<br><br>

<button onclick="editarProduto('${p.id}')">Editar</button>

<button class="ocultar" onclick="ocultarProduto('${p.id}')">
Ocultar
</button>

<button class="mostrar" onclick="mostrarProduto('${p.id}')">
Mostrar
</button>

<button class="excluir" onclick="excluirProduto('${p.id}')">
Excluir
</button>
</div>
`).join("");

}

window.editarProduto = async function(id){

const p = produtos.find(x => x.id === id);

let novoNome = prompt("Nome:", p.nome);
let novoPreco = prompt("Preço:", p.preco);
let novoPrecoAntigo = prompt("Preço antigo:", p.precoAntigo || 0);
let novoEstoque = prompt("Estoque:", p.estoque);
let novaCategoria = prompt("Categoria:", p.categoria);
let novoStatus = prompt("Status (reservado ou vazio):", p.status || "");

if(novoNome !== null){

await updateDoc(doc(db,"produtos",id),{
nome:novoNome,
preco:Number(novoPreco),
precoAntigo:Number(novoPrecoAntigo),
estoque:Number(novoEstoque),
categoria:novaCategoria,
status:novoStatus,
ativo:Number(novoEstoque) > 0
});

alert("Produto atualizado!");

}

}

window.ocultarProduto = async function(id){
await updateDoc(doc(db,"produtos",id),{
ativo:false
});
alert("Produto ocultado!");
}

window.mostrarProduto = async function(id){
await updateDoc(doc(db,"produtos",id),{
ativo:true
});
alert("Produto ativado!");
}

window.excluirProduto = async function(id){

if(confirm("Deseja excluir?")){
await deleteDoc(doc(db,"produtos",id));
alert("Excluído!");
}

}

</script>

</body>
</html>
