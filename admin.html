<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Onça</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f4f4;color:#222}header{background:#003b80;color:white;text-align:center;padding:18px}header a{color:white}.banner{background:#005bbb;color:white;text-align:center;padding:30px}.banner img{max-width:280px;border-radius:18px}.box{background:white;margin:20px;padding:20px;border-radius:15px;box-shadow:0 2px 8px #ccc}.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;padding:25px}.card{background:white;border-radius:15px;padding:15px;box-shadow:0 3px 10px #999;text-align:center}.card img{width:100%;height:230px;object-fit:cover;border-radius:12px;background:#ddd}.preco{font-size:24px;color:#080;font-weight:bold}.esgotado{color:#c00;font-weight:bold}button{background:#25d366;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px}.danger{background:#c00}.azul{background:#003b80}input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}.item{border-bottom:1px solid #ddd;padding:10px 0}.linha{display:grid;grid-template-columns:2fr 1fr 1fr 1.7fr 1fr auto;gap:8px;border-bottom:1px solid #ddd;padding:8px 0}.msg{padding:12px;border-radius:8px;background:#fff3cd;margin:10px 0}footer{background:#003b80;color:white;text-align:center;padding:20px}@media(max-width:900px){.linha{grid-template-columns:1fr}.produtos{grid-template-columns:1fr}}</style></head><body>
<header><h1>🔒 Painel Admin Onça</h1><p><a href="index.html">Ver site</a></p></header>

const loginBox=document.getElementById("loginBox"),painelBox=document.getElementById("painelBox"),listaProdutos=document.getElementById("listaProdutos"),erroLogin=document.getElementById("erroLogin");

window.sair=async function(){await signOut(auth)}
onAuthStateChanged(auth,u=>{if(u){loginBox.style.display="none";painelBox.style.display="block";carregarProdutos()}else{loginBox.style.display="block";painelBox.style.display="none"}})
function carregarProdutos(){onSnapshot(query(collection(db,"produtos"),orderBy("nome")),s=>{produtos=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{listaProdutos.innerHTML="Erro Firestore: "+e.message})}
function render(){listaProdutos.innerHTML=produtos.map(p=>`<div class="linha"><input value="${p.nome||''}" onchange="atualizar('${p.id}','nome',this.value)"><input type="number" step="0.01" value="${p.preco||0}" onchange="atualizar('${p.id}','preco',parseFloat(this.value||0))"><input type="number" value="${p.estoque||0}" onchange="atualizar('${p.id}','estoque',parseInt(this.value||0))"><input value="${p.img||'img/sem-foto.jpeg'}" onchange="atualizar('${p.id}','img',this.value)"><select onchange="atualizar('${p.id}','ativo',this.value==='true')"><option value="true" ${p.ativo!==false?'selected':''}>Ativo</option><option value="false" ${p.ativo===false?'selected':''}>Oculto</option></select><button class="danger" onclick="excluir('${p.id}')">Excluir</button></div>`).join("")||"Nenhum produto cadastrado."}
window.atualizar=async function(id,campo,valor){await updateDoc(doc(db,"produtos",id),{[campo]:valor})}
window.excluir=async function(id){if(confirm("Excluir produto?"))await deleteDoc(doc(db,"produtos",id))}
window.novoProduto=async function(){let nome=document.getElementById("novoNome").value.trim();if(!nome)return alert("Digite o nome");await addDoc(collection(db,"produtos"),{nome,preco:parseFloat(document.getElementById("novoPreco").value||0),estoque:parseInt(document.getElementById("novoEstoque").value||0),img:document.getElementById("novaFoto").value.trim()||"img/sem-foto.jpeg",ativo:true});document.getElementById("novoNome").value="";document.getElementById("novoPreco").value="";document.getElementById("novoEstoque").value="";document.getElementById("novaFoto").value=""}
window.carregarInicial=async function(){let ex=await getDocs(collection(db,"produtos"));if(ex.size>0&&!confirm("Já existem produtos. Continuar pode duplicar. Deseja continuar?"))return;for(const p of iniciais)await addDoc(collection(db,"produtos"),p);alert("Tabela inicial carregada.")}
