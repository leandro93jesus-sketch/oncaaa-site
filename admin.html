<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Onça 3.0</title>
<style>
body{
  font-family:Arial;
  background:#eef3f8;
  margin:0;
}
.box{
  background:#fff;
  margin:15px;
  padding:15px;
  border-radius:12px;
}
input,button{
  width:100%;
  padding:12px;
  margin:6px 0;
}
button{
  background:#25d366;
  color:#fff;
  border:0;
  font-weight:bold;
}
img{
  max-width:180px;
}
</style>
</head>
<body>

<div class="box">
<h2>Admin Onça 3.0</h2>

<input id="nome" placeholder="Nome do produto">
<input id="preco" type="number" placeholder="Preço">
<input id="estoque" type="number" placeholder="Estoque">

<input id="foto" type="file" accept="image/*">
<img id="preview" style="display:none">

<button onclick="uploadFoto()">Enviar foto</button>

<input id="imgUrl" placeholder="URL da imagem">

<button onclick="salvarProduto()">Salvar produto</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyAkq8rimqGQ6BYd6sfAkTiHsl7g5nnP5fc",
 authDomain:"oncas-produtos-de-limpeza.firebaseapp.com",
 projectId:"oncas-produtos-de-limpeza"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.uploadFoto = async function(){
 const file = document.getElementById("foto").files[0];

 if(!file){
   alert("Escolha uma foto primeiro");
   return;
 }

 const formData = new FormData();
 formData.append("file", file);
 formData.append("upload_preset", "difiv4ogr");

 const res = await fetch("https://api.cloudinary.com/v1_1/onca_upload/image/upload", {
   method:"POST",
   body:formData
 });

 const data = await res.json();

 if(data.secure_url){
   document.getElementById("imgUrl").value = data.secure_url;
   document.getElementById("preview").src = data.secure_url;
   document.getElementById("preview").style.display = "block";
   alert("Foto enviada com sucesso!");
 } else {
   alert("Erro ao enviar: " + JSON.stringify(data));
 }
}

window.salvarProduto = async function(){

 if(!document.getElementById("imgUrl").value){
   alert("Envie a foto primeiro");
   return;
 }

 await addDoc(collection(db,"produtos"),{
   nome:document.getElementById("nome").value,
   preco:Number(document.getElementById("preco").value || 0),
   estoque:Number(document.getElementById("estoque").value || 0),
   img:document.getElementById("imgUrl").value,
   ativo:Number(document.getElementById("estoque").value || 0) > 0
 });

 alert("Produto salvo com sucesso!");

 document.getElementById("nome").value = "";
 document.getElementById("preco").value = "";
 document.getElementById("estoque").value = "";
 document.getElementById("foto").value = "";
 document.getElementById("imgUrl").value = "";
 document.getElementById("preview").style.display = "none";
}
</script>

</body>
</html>
