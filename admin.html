onAuthStateChanged(auth,u=>{login.style.display=u?"none":"block";painel.style.display=u?"block":"none";if(u)carregar()})
function carregar(){onSnapshot(query(collection(db,"produtos"),orderBy("nome")),s=>{produtos=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
function render(){lista.innerHTML=produtos.map(p=>`<div class="linha"><input value="${p.nome||''}" onchange="salvarCampo('${p.id}','nome',this.value)"><input type="number" step="0.01" value="${p.preco||0}" onchange="salvarCampo('${p.id}','preco',parseFloat(this.value))"><input type="number" value="${p.estoque||0}" onchange="salvarCampo('${p.id}','estoque',parseInt(this.value||0))"><input value="${p.img||'img/sem-foto.jpeg'}" onchange="salvarCampo('${p.id}','img',this.value)"><select onchange="salvarCampo('${p.id}','ativo',this.value==='true')"><option value="true" ${p.ativo!==false?'selected':''}>Ativo</option><option value="false" ${p.ativo===false?'selected':''}>Oculto</option></select><button class="danger" onclick="excluir('${p.id}')">Excluir</button></div>`).join("")||"Nenhum produto."}
