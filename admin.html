<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Onça 4.0</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f4f8;
    margin:0;
    padding:20px;
}
.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h2,h3{
    text-align:center;
}
input, button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    background:#28a745;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#218838;
}
img{
    max-width:200px;
    display:block;
    margin:auto;
}
.produto{
    border:1px solid #ddd;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
}
.excluir{
    background:#c00;
}
</style>
</head>
<body>

<div class="container">
    <h2>Painel Admin Onça 4.0</h2>

    <input type="text" id="nome" placeholder="Nome do produto">
    <input type="number" id="preco" placeholder="Preço">
    <input type="number" id="estoque" placeholder="Estoque">

    <input type="file" id="foto" accept="image/*">
    <button onclick="uploadFoto()">Enviar Foto</button>

    <img id="preview">

    <input type="text" id="imgUrl" placeholder="URL da imagem">

    <button onclick="salvarProduto()">Salvar Produto</button>

    <hr>

    <h3>Produtos cadastrados</h3>

    <input type="text" id="buscar" placeholder="Buscar produto" oninput="listarProdutos()">

    <div id="listaProdutos"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAkq8rimqGQ6BYd6sfAkTiHsl7g5nnP5fc",
    authDomain: "oncas-produtos-de-limpeza.firebaseapp.com",
    projectId: "oncas-produtos-de-limpeza"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];

window.uploadFoto = async function(){

    const file = document.getElementById("foto").files[0];

    if(!file){
        alert("Escolha uma foto primeiro");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "ONCA_UPLOAD");

    const response = await fetch(
        "https://api.cloudinary.com/v1_1/difiv4ogr/image/upload",
        {
            method: "POST",
            body: formData
        }
    );

    const data = await response.json();

    if(data.secure_url){
        document.getElementById("imgUrl").value = data.secure_url;
        document.getElementById("preview").src = data.secure_url;
        alert("Foto enviada com sucesso!");
    }else{
        alert("Erro: " + JSON.stringify(data));
    }
}

window.salvarProduto = async function(){

    const nome = document.getElementById("nome").value;
    const preco = document.getElementById("preco").value;
    const estoque = document.getElementById("estoque").value;
    const img = document.getElementById("imgUrl").value;

    if(!img){
        alert("Envie a foto primeiro");
        return;
    }

    await addDoc(collection(db,"produtos"),{
        nome:nome,
        preco:Number(preco),
        estoque:Number(estoque),
        img:img,
        ativo:Number(estoque) > 0
    });

    alert("Produto salvo!");

    document.getElementById("nome").value = "";
    document.getElementById("preco").value = "";
    document.getElementById("estoque").value = "";
    document.getElementById("foto").value = "";
    document.getElementById("imgUrl").value = "";
}

onSnapshot(collection(db,"produtos"), (snap)=>{
    produtos = snap.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
    }));

    listarProdutos();
});

window.listarProdutos = function(){

    const busca = (document.getElementById("buscar").value || "").toLowerCase();

    const filtrados = produtos.filter(p =>
        (p.nome || "").toLowerCase().includes(busca)
    );

    document.getElementById("listaProdutos").innerHTML =
    filtrados.map(p => `
        <div class="produto">
            <img src="${p.img}">
            <b>${p.nome}</b><br>
            Preço: R$ ${p.preco}<br>
            Estoque: ${p.estoque}<br><br>

            <button onclick="editarProduto('${p.id}')">Editar</button>
            <button class="excluir" onclick="excluirProduto('${p.id}')">Excluir</button>
        </div>
    `).join("");
}

window.editarProduto = async function(id){

    const p = produtos.find(x => x.id === id);

    let novoPreco = prompt("Novo preço:", p.preco);
    let novoEstoque = prompt("Novo estoque:", p.estoque);

    if(novoPreco !== null && novoEstoque !== null){

        await updateDoc(doc(db,"produtos",id),{
            preco:Number(novoPreco),
            estoque:Number(novoEstoque),
            ativo:Number(novoEstoque) > 0
        });

        alert("Produto atualizado!");
    }
}

window.excluirProduto = async function(id){

    if(confirm("Deseja excluir esse produto?")){

        await deleteDoc(doc(db,"produtos",id));

        alert("Produto excluído!");
    }
}

</script>

</body>
</html>
